<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salón Comunal</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><h1>Salón Comunal</h1><span><span id="rol"></span> · <span id="estado-conexion">Sin conectar</span></span></header>

  <section id="entrar">
    <h2>Entrar al salón</h2>
    <form id="form-entrar">
      <label for="nombre">Tu nombre</label>
      <input id="nombre" autocomplete="name" placeholder="Ej.: Felipe" required>
      <button type="submit">Entrar</button>
    </form>
  </section>

  <div id="aviso-pausa" hidden></div>
  <main id="salon" hidden>
    <aside>
      <div id="caja-vacios" hidden>
        <h2>⚑ Reportes de vacíos: revisar primero</h2>
        <ul id="vacios"></ul>
      </div>
      <h2>Quién tiene la palabra</h2>
      <p id="palabra" class="grande">Nadie</p>
      <p id="fila"></p>

      <h2>Participantes</h2>
      <ul id="participantes"></ul>

      <div id="caja-modos" hidden>
        <h2>Pedidos de modo rápido</h2>
        <ul id="modos"></ul>
      </div>

      <h2>Agregar un agente de prueba</h2>
      <form id="form-agente">
        <select id="estilo">
          <option value="creativa">Creativo</option>
          <option value="critica">Crítico</option>
          <option value="practica">Práctico</option>
        </select>
        <input id="nombre-agente" placeholder="Nombre (opcional)">
        <button type="submit">Agregar</button>
      </form>
    </aside>

    <section id="conversacion">
      <div id="resumen" hidden>
        <h2>Mientras no estabas</h2>
        <ul id="resumen-lineas"></ul>
        <details id="resumen-detalle"><summary>Ver los mensajes</summary><ol id="resumen-mensajes"></ol></details>
        <button id="btn-resumen-ok">Entendido</button>
      </div>
      <div id="recuadros" aria-label="Participantes"></div>
      <h2>Conversación</h2>
      <ol id="transcripcion"></ol>
      <p id="error" role="alert"></p>
      <form id="form-mensaje">
        <input id="mensaje" placeholder="Escribe tu mensaje…" autocomplete="off">
        <button type="submit">Enviar</button>
      </form>
      <div class="botones">
        <button id="btn-pedir">Pedir la palabra</button>
        <button id="btn-retirar">Retirar mi pedido</button>
        <button id="btn-soltar">Soltar la palabra</button>
        <button id="btn-interrumpir">Interrumpir al agente</button>
        <button id="btn-bano">Baño</button>
      </div>
    </section>
  </main>
  <script src="/static/tiles.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
